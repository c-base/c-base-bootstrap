<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>c-base-bootstrap demo</title>
  <link href="css/cyborg.min.css" rel="stylesheet">
  <link href="css/bootstrap.custom.css" rel="stylesheet">
  <link href="css/glyphicons.css" rel="stylesheet">
  <style>
    /* the dimmed station picture, as used by c-beam */
    body {
      padding-top: 70px;
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                  url("img/bg.jpg") center center / cover no-repeat fixed;
      background-color: #000;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">c-base</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-main"
              aria-controls="navbar-main" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="navbar-main" class="collapse navbar-collapse">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">c-login</a></li>
          <li class="nav-item"><a class="nav-link" href="#">c-out</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">help</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">API</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1>c-base-bootstrap</h1>
    <p>Bootswatch Cyborg for Bootstrap 5 with the c-base additions. <a href="#">A link</a> and
       <span class="text-muted">muted text</span>.</p>

    <h2>buttons</h2>
    <p>
      <button class="btn btn-primary">primary</button>
      <button class="btn btn-secondary">secondary</button>
      <button class="btn btn-default">default (alias)</button>
      <button class="btn btn-red">red</button>
      <button class="btn btn-success">success</button>
      <button class="btn btn-danger">danger</button>
      <button class="btn btn-secondary"><span class="glyphicon glyphicon-off"></span> glyphicon</button>
    </p>

    <h2>table</h2>
    <table class="table">
      <thead id="tablehead"><tr><th>member</th><th>status</th><th class="right">eta</th></tr></thead>
      <tbody>
        <tr><td>smile</td><td>on board</td><td class="alignright">–</td></tr>
        <tr><td>keks</td><td>eta</td><td class="alignright">20:00</td></tr>
      </tbody>
    </table>

    <h2>terminal</h2>
    <div class="terminal">
      <div>c-beam&gt; who</div>
      <div class="thanks">smile, keks</div>
      <div class="protest">access denied</div>
    </div>

    <h2>form</h2>
    <form class="row g-3" style="max-width: 420px">
      <div class="col-12">
        <label class="form-label" for="demo-user">username</label>
        <input class="form-control" id="demo-user" placeholder="username">
      </div>
      <div class="col-12">
        <button type="button" class="btn btn-primary btn-block">login</button>
      </div>
    </form>

    <h2>card</h2>
    <div class="card transparent" style="max-width: 420px">
      <div class="card-header">bar status</div>
      <div class="card-body">open</div>
    </div>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
